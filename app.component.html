<!DOCTYPE html>
<html>
<head>
    <title>Angular Login Component</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        .login-container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #1976d2; color: white; border: none; border-radius: 5px; }
        .error { color: red; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Welcome Back</h2>
        <p>Please login to continue</p>
        <input type="email" placeholder="Email Address">
        <input type="password" placeholder="Password">
        <p class="error">Invalid credentials. Please try again.</p>
        <button>Sign In</button>
        <p>Don't have an account? <a href="#">Register</a></p>
    </div>
</body>
</html>
